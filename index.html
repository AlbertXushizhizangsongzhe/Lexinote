<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f2"><title>拾词 Lexinote · 你的个人单词本</title><meta name="author" content="陈泓旭 Albert"><meta name="description" content="收藏阅读中遇见的生词，用翻卡与英文释义自测，让每一次遇见都有回响。"><link rel="stylesheet" href="style.css"></head><body><aside class="sidebar"><a class="brand" href="#home"><span class="logo">L<span>✳</span></span><span>拾词<span class="brand-sub">LEXINOTE</span></span></a><div class="nav-label">我的学习空间</div><nav><button data-nav="home">◈ <span>学习概览</span></button><button data-nav="words">▤ <span>我的单词本</span><b id="navCount">0</b></button><button data-nav="review">▱ <span>翻卡复习</span></button><button data-nav="quiz">✧ <span>释义自测</span></button></nav><div class="side-note"><span class="sprout">✳</span><strong>每天一点，慢慢记住。</strong><p>让每一个偶然遇见的词，<br>成为你表达的一部分。</p></div><div class="profile"><div class="avatar">K</div><div>我的个人词库<small>保存在此浏览器</small></div><span class="local-dot"></span></div></aside><main><header><div class="breadcrumb">我的学习空间 <span>/</span> <b id="crumb">学习概览</b></div><div class="header-right"><span id="today"></span><button class="btn primary" data-add>＋ 录入生词</button></div></header><div id="app"></div><footer><span>LEXINOTE · 让词汇生根</span><span class="author-credit">项目发起、产品设计与维护：<strong>陈泓旭 Albert</strong> · <a href="https://github.com/AlbertXushizhizangsongzhe/Lexinote" target="_blank" rel="noopener noreferrer">GitHub 项目 ↗</a></span><span>本地保存 <i class="local-dot"></i> 建议定期导出备份</span></footer></main><dialog id="entry"><form id="wordForm"><div class="modal-head"><div><div class="eyebrow">COLLECT A NEW WORD</div><h2 id="entryTitle">收下一个新单词</h2></div><button type="button" class="icon-btn" data-close aria-label="关闭">×</button></div><div class="segmented"><button type="button" id="smartTab" class="active">✧ 粘贴并自动整理</button><button type="button" id="manualTab">手动整理</button></div><div id="smartPanel"><label for="lookupInput">粘贴英文单词或中文释义</label><textarea id="lookupInput" maxlength="4000" placeholder="例如 endeavor，或 努力；尝试
也可以把单词、中文和原句一起粘贴进来。"></textarea><label for="sourceSentence">英文原句 <span class="muted">可选，有原句更方便判断词义</span></label><textarea id="sourceSentence" maxlength="3000" placeholder="例如 They endeavor to improve the lives of others."></textarea><div class="auto-action"><span class="hint">自动识别输入，补全词性、中英文释义。</span><button type="button" class="btn primary" id="lookupBtn">✧ 自动识别并完善</button></div><div id="lookupStatus" role="status" aria-live="polite"></div></div><section id="entryResult" hidden><div id="resultHeading" class="result-heading">已整理成单词卡 <span>可直接保存，也可以修改下方内容</span></div><input type="hidden" id="editId"><div class="form-grid"><div><label for="word">英文单词 / 短语 <em>*</em></label><input id="word" required maxlength="150" placeholder="endeavor"></div><div><label for="pos">词性（可选）</label><input id="pos" maxlength="80" placeholder="noun / verb"></div></div><label for="zh">中文释义 <em>*</em></label><input id="zh" required maxlength="1000" placeholder="努力；尝试"><label for="en">英文释义 <em>*</em></label><textarea id="en" required maxlength="3000" placeholder="an effort or attempt to do something"></textarea><div class="form-grid"><div><label for="category">分类</label><input id="category" list="categories" placeholder="日常阅读" maxlength="80"><datalist id="categories"><option>SAT</option><option>AP Lang</option><option>生物</option><option>日常阅读</option></datalist></div><div><label for="note">个人备注（可选）</label><input id="note" maxlength="1000" placeholder="记忆方法、易混词……"></div></div><label for="sentence">原句 / 例句 <span class="muted">可选</span></label><textarea id="sentence" maxlength="3000" placeholder="把你遇见这个词的那句话，一起留下。"></textarea><details id="alternativePanel" hidden><summary>其他可能的词义 · 点此调整</summary><div id="candidates"></div></details></section><div class="form-bottom"><span class="hint">保存后自动生成单词卡</span><button class="btn primary" id="saveWord" type="submit" disabled>保存到单词本 ↗</button></div></form></dialog><input type="file" id="importFile" accept="application/json,.json" hidden><div class="toast" id="toast" role="status"></div><script src="daily.js"></script><script src="app.js"></script><script src="lookup.js"></script></body></html>
